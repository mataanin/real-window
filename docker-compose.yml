services:
  property-lookup:
    build: .
    init: true
    ports:
      - "8000:8000"
    environment:
      - API_TOKEN=${API_TOKEN:-}
      - CDP_PORT=9223
      - CACHE_TTL_HOURS=${CACHE_TTL_HOURS:-24}
      - PROXY=${PROXY:-}
      - DB_PATH=/app/data/property_lookup.db
    volumes:
      - ./output:/app/output
      - ./data:/app/data
      - chrome-profile:/app/.property-lookup/chrome-profile
    restart: unless-stopped
    shm_size: '2gb'

volumes:
  chrome-profile:
