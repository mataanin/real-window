services:
  property-lookup:
    build: .
    init: true
    # Host networking puts Chrome's loopback-only CDP port (127.0.0.1:9223) on the
    # host, where the agentcookie sink injects cookies. The API listens on host :8000.
    network_mode: host
    environment:
      - API_TOKEN=${API_TOKEN:-}
      - CDP_PORT=9223
      - CACHE_TTL_HOURS=${CACHE_TTL_HOURS:-24}
      - PROXY=${PROXY:-}
      - DB_PATH=/app/data/property_lookup.db
      - BROWSER_PROVIDER=${BROWSER_PROVIDER:-}
      - BROWSERBASE_API_KEY=${BROWSERBASE_API_KEY:-}
      - BROWSERBASE_PROJECT_ID=${BROWSERBASE_PROJECT_ID:-}
      - BROWSERBASE_CONTEXT_ID=${BROWSERBASE_CONTEXT_ID:-}
      - BROWSERBASE_VERIFIED=${BROWSERBASE_VERIFIED:-}
      - BROWSERBASE_OS=${BROWSERBASE_OS:-}
      - BROWSERBASE_SOLVE_CAPTCHAS=${BROWSERBASE_SOLVE_CAPTCHAS:-}
      - BROWSERBASE_BLOCK_ADS=${BROWSERBASE_BLOCK_ADS:-}
      - BROWSERBASE_PROXIES=${BROWSERBASE_PROXIES:-}
      - BROWSERBASE_PROXY_COUNTRY=${BROWSERBASE_PROXY_COUNTRY:-}
      - BROWSERBASE_PROXY_STATE=${BROWSERBASE_PROXY_STATE-CT}
      - BROWSERBASE_PROXY_CITY=${BROWSERBASE_PROXY_CITY:-}
      - BROWSERBASE_EXTERNAL_PROXY=${BROWSERBASE_EXTERNAL_PROXY:-}
      - BROWSERBASE_EXTERNAL_PROXY_USERNAME=${BROWSERBASE_EXTERNAL_PROXY_USERNAME:-}
      - BROWSERBASE_EXTERNAL_PROXY_PASSWORD=${BROWSERBASE_EXTERNAL_PROXY_PASSWORD:-}
      - BROWSERBASE_REGION=${BROWSERBASE_REGION:-}
      - BROWSERBASE_RECORD_SESSION=${BROWSERBASE_RECORD_SESSION:-}
      - BROWSERBASE_SESSION_TIMEOUT=${BROWSERBASE_SESSION_TIMEOUT:-}
      - BROWSERBASE_CAPTCHA_WAIT=${BROWSERBASE_CAPTCHA_WAIT:-}
    volumes:
      - ./output:/app/output
      - ./data:/app/data
      - chrome-profile:/app/.property-lookup/chrome-profile
    restart: unless-stopped
    shm_size: '2gb'

volumes:
  chrome-profile:
